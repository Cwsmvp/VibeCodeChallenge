<section class="result-card" aria-labelledby="evaluation-title">
  <div class="card-topline">
    <span class="card-icon" aria-hidden="true">✦</span>
    <span class="card-number" aria-hidden="true">01 / 03</span>
  </div>
  <h2 id="evaluation-title">Đánh giá tên</h2>
  <div id="evaluation-content" class="ai-content" aria-live="polite" aria-busy="{{ 'true' if state.slug else 'false' }}">
  {% if state.slug %}
    {% with loading_message = 'Đang đánh giá tên thương hiệu…' %}
      {% include 'components/loading.html' %}
    {% endwith %}
  {% else %}
    <div class="empty-state" aria-label="Chưa có đánh giá">
      <span class="empty-orbit" aria-hidden="true"></span>
      <p>Đánh giá sẽ xuất hiện ở đây</p>
    </div>
  {% endif %}
  </div>
  {% if state.slug %}
    <button class="button button-secondary slogans-retry" id="evaluation-retry" type="button" disabled>Thử lại <span aria-hidden="true">↻</span></button>
    <noscript><p class="evaluation-error">Bật JavaScript để tải kết quả AI.</p></noscript>
  {% endif %}
</section>
